name: Revision 7 media review
on:
  push:
    branches: [main]
    paths: ['tools/discover_v7_media.py', '.github/workflows/v7-media.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: v7-media
  cancel-in-progress: true
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: python3 -m pip install --quiet pillow beautifulsoup4
      - run: python3 tools/discover_v7_media.py
      - name: Record findings
        run: |
          git config user.name 'Vineria media review'
          git config user.email '151435441+Petrinus@users.noreply.github.com'
          git add reports/v7-media
          git commit -m 'Record public media references for revision 7 [skip ci]' || true
          git pull --rebase origin main
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        with:
          name: revision-7-media
          path: reports/v7-media
