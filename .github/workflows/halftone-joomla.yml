name: Approved halftone and shared controls
on:
  push:
    branches: [main]
    paths: ['update/**', '.github/workflows/halftone-joomla.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: vineria-approved-halftone
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Install build and browser tools
        run: |
          python3 -m pip install --quiet pillow numpy beautifulsoup4 playwright
          python3 -m playwright install --with-deps chromium
      - name: Preserve approved originals and create monochrome halftone
        run: python3 update/artwork.py
      - name: Update the eight existing styles and common control panel
        run: |
          python3 update/build.py
          python3 update/refine.py
      - name: Test every style and the content editor
        run: python3 update/qa.py
      - name: Publish the tested preview files
        run: |
          git config user.name 'Vineria review builder'
          git config user.email '151435441+Petrinus@users.noreply.github.com'
          git add site update/input update/qa.py reports/halftone skills/joomla-vineria/SKILL.md
          if ! git diff --cached --quiet; then
            git commit -m 'Publish original logo, monochrome dish artwork and shared content controls [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
          git rev-parse HEAD > reports/halftone/published-revision.txt
      - name: Check public preview delivery
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from urllib.request import Request,urlopen
          from bs4 import BeautifulSoup
          import json
          sha=Path('reports/halftone/published-revision.txt').read_text().strip()
          base='https://rawcdn.githack.com/Petrinus/vineria-revision/'+sha+'/site/'
          result={'revision':sha,'checks':[]}
          for route,selector in [('index.html','[data-proposal]'),('verwaltung/vorschau.html','#vde-control'),('entwuerfe/v08/index.html','[data-live-menu]')]:
              row={'url':base+route}
              try:
                  with urlopen(Request(base+route,headers={'User-Agent':'Mozilla/5.0'}),timeout=35)as response:
                      row['status']=response.status
                      soup=BeautifulSoup(response.read().decode('utf-8'),'html.parser')
                  row['elements']=len(soup.select(selector))
              except Exception as exc:row['error']=str(exc)
              result['checks'].append(row)
          result['verified']=all(x.get('status')==200 and x.get('elements',0)>0 for x in result['checks'])
          Path('reports/halftone/public.json').write_text(json.dumps(result,ensure_ascii=False,indent=2))
          print(json.dumps(result,ensure_ascii=False,indent=2))
          PY
          git add reports/halftone/public.json reports/halftone/published-revision.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Record public preview verification [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vineria-halftone-shared-controls
          path: |
            site
            reports/halftone
            docs/JOOMLA_MIGRACION_ES.md
            docs/JOOMLA_MCP_ES.md
            skills/joomla-vineria/SKILL.md
