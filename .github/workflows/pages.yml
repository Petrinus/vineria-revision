name: Publish client review
on:
  push:
    branches: [main]
    paths: ['src/**', 'tools/assets.py', 'tools/build.py', 'tools/build_base.py', 'tools/refine.py', 'tools/recover-brand.py', 'tools/polish.py', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Prepare media and all paired proposals
        run: |
          python3 -m pip install --quiet Pillow beautifulsoup4
          mkdir -p site
          python3 tools/assets.py
          python3 tools/build.py
          python3 tools/polish.py
          if [ -f tools/proposals.py ]; then
            python3 tools/proposals.py
            if [ -f tools/proposal_fixes.py ]; then python3 tools/proposal_fixes.py; fi
          elif [ -f tools/build_review_portal.py ]; then
            python3 tools/build_review_portal.py
          fi
          touch site/.nojekyll
      - name: Save compiled public review
        run: |
          git config user.name 'Vineria review builder'
          git config user.email '151435441+Petrinus@users.noreply.github.com'
          git add site
          if ! git diff --cached --quiet; then
            git commit -m 'Build client selector with all restaurant and shop proposals [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: vineria-review
          path: site
      - name: Configure native GitHub Pages
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v4
        if: steps.pages.outcome == 'success'
        with:
          path: site
      - name: Deploy review
        id: deployment
        if: steps.pages.outcome == 'success'
        uses: actions/deploy-pages@v4
      - name: Record native Pages status
        if: steps.pages.outcome != 'success'
        run: echo 'Review files are built and available in the repository. Native Pages activation requires repository administration access not granted to this integration.'
