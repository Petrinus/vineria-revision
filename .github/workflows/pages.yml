name: Publish client review
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare review files
        run: |
          mkdir -p site
          if [ ! -f site/index.html ]; then
            printf '<!doctype html><html lang="de"><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>Vineria del Este</title><h1>Vineria del Este</h1><p>Die neue Designansicht wird vorbereitet. Dies ist nicht die Restaurant-Website.</p></html>' > site/index.html
          fi
          touch site/.nojekyll
          if [ -f tools/build.py ]; then python3 tools/build.py; fi
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy review
        id: deployment
        uses: actions/deploy-pages@v4
