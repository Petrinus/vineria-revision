name: Model 08 and real product photographs
on:
  push:
    branches: [main]
    paths: ['models/**', 'tools/product_photos.py', 'tools/build_model08.py', 'tools/qa_product_photos.py', '.github/workflows/model08.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: model08-product-photos
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - name: Install image and browser tools
        run: |
          python3 -m pip install --quiet Pillow beautifulsoup4 playwright
          python3 -m playwright install --with-deps chromium
      - name: Add requested real product images to the current shops
        run: python3 tools/product_photos.py
      - name: Check photographs in the seven existing shops
        run: python3 tools/qa_product_photos.py
      - name: Build the separately requested model 08
        run: python3 tools/build_model08.py
      - name: Capture model 08 restaurant and shop
        run: |
          python3 -m playwright screenshot --viewport-size="1440,1000" --full-page --wait-for-timeout=1600 "file://$PWD/site/entwuerfe/v08/index.html" reports/model08/restaurant.png
          python3 -m playwright screenshot --viewport-size="1440,1000" --full-page --wait-for-timeout=1600 "file://$PWD/site/entwuerfe/v08/shop/index.html" reports/model08/shop.png
          python3 -m playwright screenshot --viewport-size="390,1000" --full-page --wait-for-timeout=1000 "file://$PWD/site/entwuerfe/v08/index.html" reports/model08/mobile.png
      - name: Refresh the new model thumbnails and verify the selector
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          from bs4 import BeautifulSoup
          import json
          for area in ['restaurant','shop']:
              image=Image.open('reports/model08/'+area+'.png').convert('RGB')
              image=image.crop((0,0,image.width,min(image.height,1000)))
              image.thumbnail((720,500))
              image.save('site/assets/proposals/v08-'+area+'.webp',quality=88)
          portal=BeautifulSoup(Path('site/index.html').read_text(),'html.parser')
          assert len(portal.select('[data-proposal]'))==8
          assert len(portal.select('[data-proposal="v08"]'))==1
          home=BeautifulSoup(Path('site/entwuerfe/v08/index.html').read_text(),'html.parser')
          count=len(home.select('.menu-section article.dish'))
          expected=sum(len(rows) for rows in json.loads(Path('site/assets/catalog.json').read_text())['menu'].values())
          assert count==expected
          assert home.select_one('.photo-stack') and home.select_one('.shop-slip')
          assert home.select_one('[data-events-form]')
          assert not home.select('.scene-star')
          Path('reports/model08/structure.json').write_text(json.dumps({'models':8,'model08_menu_items':count,'previous_models_kept':True,'events_form':True,'static_checks_passed':True},indent=2))
          PY
      - name: Publish the reviewed files
        run: |
          git config user.name 'Vineria design builder'
          git config user.email '151435441+Petrinus@users.noreply.github.com'
          git add site src/catalog.json reports/product-photos reports/model08
          if ! git diff --cached --quiet; then
            git commit -m 'Add independent model 08 and real product photos across all shop styles [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
          git rev-parse HEAD > reports/model08/published-revision.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model08-and-product-photos
          path: |
            site
            reports/model08
            reports/product-photos
