name: Verify public proposal selector
on:
  push:
    branches: [main]
    paths: ['.github/workflows/public-proposal-check.yml']
  workflow_run:
    workflows: ['Publish all design proposals']
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-proposal-check
  cancel-in-progress: true
jobs:
  public-check:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Prepare browser
        run: |
          python3 -m pip install --quiet playwright
          python3 -m playwright install --with-deps chromium
      - name: Verify the exact complete review revision without stale branch caching
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source=Path('tools/verify_public_proposals.py').read_text()
          source=source.replace('https://raw.githack.com/Petrinus/vineria-revision/main/site/','https://rawcdn.githack.com/Petrinus/vineria-revision/6c176c44bd7a88fc09826ed810cafbab5f5a84c7/site/')
          exec(compile(source,'tools/verify_public_proposals.py','exec'))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-proposal-browser-check
          path: reports/proposals
