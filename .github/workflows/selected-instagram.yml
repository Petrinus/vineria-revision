name: Retrieve selected Instagram photos
on:
  push:
    branches: [main]
    paths: ['media/instagram-selection.json','tools/import_selected_instagram.py','.github/workflows/selected-instagram.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: vineria-selected-instagram
  cancel-in-progress: true
jobs:
  retrieve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Install public image retrieval tools
        run: python3 -m pip install --quiet Pillow beautifulsoup4
      - name: Fetch only the exact selected public posts
        run: python3 tools/import_selected_instagram.py
      - name: Preserve verified images and the import report
        run: |
          git config user.name 'Vineria review builder'
          git config user.email '151435441+Petrinus@users.noreply.github.com'
          git add reports/instagram-selection site/assets/instagram-selected
          if ! git diff --cached --quiet; then
            git commit -m 'Record exact Instagram selection import and available originals [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selected-instagram-photos
          path: |
            reports/instagram-selection
            site/assets/instagram-selected
            media/instagram-selection.json
