name: Verify integrated restaurant and tienda
on:
  push:
    branches: [main]
    paths: ['tools/qa.py', 'tools/check_public_access.py', 'tools/polish.py', 'server/**', '.github/workflows/quality.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: review-quality
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: python3 -m pip install --quiet pillow playwright
      - run: python3 -m playwright install --with-deps chromium
      - name: Build current site
        run: |
          python3 tools/assets.py
          python3 tools/build.py
          python3 tools/polish.py
      - name: Functional and responsive checks
        id: qa
        continue-on-error: true
        run: python3 tools/qa.py
      - name: Isolated authenticated management checks
        id: server
        continue-on-error: true
        run: python3 server/test.py
      - name: Public first-visit check
        id: public
        if: always()
        continue-on-error: true
        run: python3 tools/check_public_access.py
      - name: Save reports in an independent worktree
        if: always()
        run: |
          git config user.name 'Vineria QA'
          git config user.email '151435441+Petrinus@users.noreply.github.com'
          git fetch origin main
          REPORT_TREE="$RUNNER_TEMP/vineria-report-$GITHUB_RUN_ID"
          git worktree add --detach "$REPORT_TREE" origin/main
          mkdir -p "$REPORT_TREE/reports/runs/$GITHUB_RUN_ID"
          find reports -maxdepth 1 -type f -exec cp {} "$REPORT_TREE/reports/runs/$GITHUB_RUN_ID/" \;
          git -C "$REPORT_TREE" add "reports/runs/$GITHUB_RUN_ID"
          if ! git -C "$REPORT_TREE" diff --cached --quiet; then
            git -C "$REPORT_TREE" commit -m 'Record executed browser and management QA [skip ci]'
            git -C "$REPORT_TREE" pull --rebase origin main
            git -C "$REPORT_TREE" push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reviewed-restaurant-shop
          path: |
            site
            reports
            server
            tools
            src
      - name: Assert QA status
        if: steps.qa.outcome != 'success' || steps.server.outcome != 'success' || steps.public.outcome != 'success'
        run: exit 1
