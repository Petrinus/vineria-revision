name: Verify integrated restaurant and tienda
on:
  push:
    branches: [main]
    paths: ['tools/qa.py', 'tools/public-check.py', '.github/workflows/quality.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: review-quality
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: python3 -m pip install --quiet pillow playwright
      - run: python3 -m playwright install --with-deps chromium
      - name: Build current site
        run: |
          python3 tools/assets.py
          python3 tools/build.py
      - name: Functional and responsive checks
        id: qa
        continue-on-error: true
        run: python3 tools/qa.py
      - name: Public URL check
        if: always() && hashFiles('tools/public-check.py') != ''
        run: python3 tools/public-check.py
      - name: Save reports
        if: always()
        run: |
          git config user.name 'Vineria QA'
          git config user.email '151435441+Petrinus@users.noreply.github.com'
          git add reports
          if ! git diff --cached --quiet; then
            git commit -m 'Record executed browser QA and screenshots [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reviewed-restaurant-shop
          path: |
            site
            reports
            server
      - name: Assert QA status
        if: steps.qa.outcome != 'success'
        run: exit 1
